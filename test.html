<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テスト課題</title>
  <!-- CSSの読み込み -->
  <link rel="stylesheet" href="test.css">
</head>
<body>

  <!-- ここに指定されたHTML要素（テキストや画像など）を書く -->

  <header>
    <!--ここに見出しと説明文を追加-->
    <h1>TNG CAFE</h1>
    <p>心安らぐ一杯をあなたに</p>

   <!--ナビゲーション(ul,li,aを使用)-->
    <nav>
      <ul>
        <li><a href="#section1">About Us</a></li>
        <li><a href="#section2">Menu</a></li>
        <li><a href="#section3">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="section1">
      <h2>About Us</h2>
      <p>TNGCafeは自然の香りに包まれリラックス空間提供しています。<br>自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。<br><br></p>
      <img src="cafe.jpg" alt="落ち着いた雰囲気のカフェ">  
    </section>

    <section id="section2">
      <h2>Menu</h2>
      <div class="menu-container">
        <div class="menu-item">
         <img src="coffee.jpg" alt="コーヒーカップに入ったブラックコーヒー">
         <p>ブレンドコーヒー</p>
        </div> 
        <div class="menu-item">
         <img src="cake.jpg" alt="べイクドチーズケーキ">
         <p>ベイクドチーズケーキ</p>
        </div>
        <div class="menu-item"> 
         <img src="latte.jpg" alt="カフェラテ"> 
         <p>カフェラテ</p>
        </div> 
     </div>   
    </section>
   
    <section id="section3">
     <h2>Contact</h2>
     <form action="#" method="post">
       <label for="name">お名前：</label><br>
       <input type="text" id="name" name="name"><br><br>

       <label for="email">メールアドレス：</label><br>
       <input type="email" id="email" name="email"><br><br>

       <label for="message">お問い合わせ内容：</label><br>
       <textarea id="message" name="message" rows="4" cols="40"></textarea><br><br>

       <button type="submit">送信</button>
     </form>
 </main> 
 
 <footer>
  <p>&copy; 2026 TNG Cafe</p>
 </footer>

</body>
</html>
